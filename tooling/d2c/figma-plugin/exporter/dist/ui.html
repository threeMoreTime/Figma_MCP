<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Antigravity D2C Exporter</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 16px;
      font-size: 13px;
      background-color: #fafafa;
      color: #333333;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #e5e5e5;
      padding-bottom: 12px;
      margin-bottom: 16px;
    }
    .title {
      font-weight: 600;
      font-size: 15px;
      color: #111;
    }
    .badge {
      background: #e6f4ff;
      color: #0958d9;
      border: 1px solid #91caff;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 500;
    }
    .card {
      background: #fff;
      border: 1px solid #e5e5e5;
      border-radius: 6px;
      padding: 12px;
      margin-bottom: 12px;
    }
    .stat-row {
      display: flex;
      justify-content: space-between;
      padding: 4px 0;
      border-bottom: 1px dashed #f0f0f0;
    }
    .stat-row:last-child {
      border-bottom: none;
    }
    .stat-label {
      color: #666;
    }
    .stat-value {
      font-weight: 500;
      color: #222;
    }
    .button-group {
      display: flex;
      gap: 8px;
      margin-top: 16px;
      flex-direction: column;
    }
    button {
      background: #1677ff;
      color: white;
      border: none;
      padding: 10px 14px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    button:hover {
      background: #4096ff;
    }
    button.secondary {
      background: #fff;
      color: #333;
      border: 1px solid #d9d9d9;
    }
    button.secondary:hover {
      border-color: #1677ff;
      color: #1677ff;
    }
    .diag-item {
      padding: 6px 8px;
      margin: 4px 0;
      border-radius: 4px;
      font-size: 12px;
    }
    .diag-WARNING {
      background: #fffbe6;
      border: 1px solid #ffe58f;
      color: #d48806;
    }
    .diag-ERROR {
      background: #fff2f0;
      border: 1px solid #ffccc7;
      color: #cf1322;
    }
    .diag-INFO {
      background: #e6f4ff;
      border: 1px solid #91caff;
      color: #0958d9;
    }
    #preview-img {
      max-width: 100%;
      height: auto;
      border-radius: 4px;
      border: 1px solid #eee;
      margin-top: 8px;
    }
    .empty-state {
      text-align: center;
      padding: 40px 16px;
      color: #888;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="title">Antigravity D2C Exporter</div>
    <span class="badge">READ-ONLY</span>
  </div>

  <div id="content">
    <div class="empty-state">
      <p>Please select a top-level Frame in Figma to begin export.</p>
      <button onclick="triggerExport()" class="secondary">Check Selection</button>
    </div>
  </div>

  <script>
    let currentPayload = null;

    function triggerExport() {
      parent.postMessage({ pluginMessage: { type: 'TRIGGER_EXPORT' } }, '*');
    }

    function downloadJson() {
      if (!currentPayload) return;
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(currentPayload, null, 2));
      const downloadAnchor = document.createElement('a');
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", `${currentPayload.rootNodeName || "export"}_export.json`);
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
    }

    function downloadScreenshot() {
      if (!currentPayload || !currentPayload.screenshotBase64) return;
      const link = document.createElement('a');
      link.href = "data:image/png;base64," + currentPayload.screenshotBase64;
      link.download = `${currentPayload.rootNodeName || "export"}_screenshot.png`;
      document.body.appendChild(link);
      link.click();
      link.remove();
    }

    function copyJson() {
      if (!currentPayload) return;
      const text = JSON.stringify(currentPayload, null, 2);
      navigator.clipboard.writeText(text).then(() => {
        alert("Export package copied to clipboard!");
      });
    }

    function renderEmptyState(messageText) {
      const container = document.getElementById('content');
      container.textContent = ''; // Clear safely

      const emptyDiv = document.createElement('div');
      emptyDiv.className = 'empty-state';

      const p1 = document.createElement('p');
      p1.style.color = '#ff4d4f';
      p1.style.fontWeight = '500';
      p1.textContent = messageText || 'No frame selected.';

      const p2 = document.createElement('p');
      p2.textContent = 'Select a Frame or Component on canvas, then click refresh.';

      const btn = document.createElement('button');
      btn.className = 'secondary';
      btn.textContent = 'Re-check Selection';
      btn.onclick = triggerExport;

      emptyDiv.appendChild(p1);
      emptyDiv.appendChild(p2);
      emptyDiv.appendChild(btn);
      container.appendChild(emptyDiv);
    }

    function createStatRow(label, value) {
      const row = document.createElement('div');
      row.className = 'stat-row';

      const labelSpan = document.createElement('span');
      labelSpan.className = 'stat-label';
      labelSpan.textContent = label;

      const valueSpan = document.createElement('span');
      valueSpan.className = 'stat-value';
      valueSpan.textContent = value;

      row.appendChild(labelSpan);
      row.appendChild(valueSpan);
      return row;
    }

    function renderExportSuccess(p) {
      const container = document.getElementById('content');
      container.textContent = ''; // Clear safely

      // Stats Card
      const statsCard = document.createElement('div');
      statsCard.className = 'card';

      statsCard.appendChild(createStatRow('Frame Name:', String(p.rootNodeName || '')));
      statsCard.appendChild(createStatRow('Node ID:', String(p.rootNodeId || '')));
      statsCard.appendChild(createStatRow('Components Used:', String(Object.keys(p.componentsUsed || {}).length)));
      statsCard.appendChild(createStatRow('Bound Variables:', `${Object.keys(p.variables || {}).length} (${Object.keys(p.collections || {}).length} collections)`));
      statsCard.appendChild(createStatRow('Dimensions:', `${p.tree?.width || 0} × ${p.tree?.height || 0} px`));
      container.appendChild(statsCard);

      // Screenshot Card (if exists)
      if (p.screenshotBase64) {
        const shotCard = document.createElement('div');
        shotCard.className = 'card';

        const shotTitle = document.createElement('div');
        shotTitle.style.fontWeight = '600';
        shotTitle.textContent = 'Frame Screenshot';
        shotCard.appendChild(shotTitle);

        const img = document.createElement('img');
        img.id = 'preview-img';
        img.alt = 'Screenshot';
        img.src = 'data:image/png;base64,' + p.screenshotBase64;
        shotCard.appendChild(img);

        container.appendChild(shotCard);
      }

      // Diagnostics Card (if exists)
      const diags = Array.isArray(p.diagnostics) ? p.diagnostics : [];
      if (diags.length > 0) {
        const diagCard = document.createElement('div');
        diagCard.className = 'card';
        diagCard.style.marginTop = '12px';

        const diagTitle = document.createElement('div');
        diagTitle.style.fontWeight = '600';
        diagTitle.style.marginBottom = '6px';
        diagTitle.textContent = `Diagnostics (${diags.length})`;
        diagCard.appendChild(diagTitle);

        for (const d of diags) {
          const item = document.createElement('div');
          const severity = ['INFO', 'WARNING', 'ERROR'].includes(d.severity) ? d.severity : 'INFO';
          item.className = `diag-item diag-${severity}`;

          const strong = document.createElement('strong');
          strong.textContent = `[${severity}] `;
          item.appendChild(strong);

          const textSpan = document.createElement('span');
          textSpan.textContent = String(d.message || '');
          item.appendChild(textSpan);

          diagCard.appendChild(item);
        }

        container.appendChild(diagCard);
      }

      // Action Buttons
      const btnGroup = document.createElement('div');
      btnGroup.className = 'button-group';

      const dlJsonBtn = document.createElement('button');
      dlJsonBtn.textContent = 'Download Full Release JSON';
      dlJsonBtn.onclick = downloadJson;
      btnGroup.appendChild(dlJsonBtn);

      if (p.screenshotBase64) {
        const dlShotBtn = document.createElement('button');
        dlShotBtn.className = 'secondary';
        dlShotBtn.textContent = 'Save PNG Screenshot';
        dlShotBtn.onclick = downloadScreenshot;
        btnGroup.appendChild(dlShotBtn);
      }

      const copyBtn = document.createElement('button');
      copyBtn.className = 'secondary';
      copyBtn.textContent = 'Copy JSON to Clipboard';
      copyBtn.onclick = copyJson;
      btnGroup.appendChild(copyBtn);

      const refreshBtn = document.createElement('button');
      refreshBtn.className = 'secondary';
      refreshBtn.textContent = 'Re-Export Selection';
      refreshBtn.onclick = triggerExport;
      btnGroup.appendChild(refreshBtn);

      container.appendChild(btnGroup);
    }

    window.onmessage = (event) => {
      if (!event || !event.data || typeof event.data !== 'object') return;
      const msg = event.data.pluginMessage;
      if (!msg || typeof msg !== 'object') return;

      if (msg.type === 'SELECTION_EMPTY') {
        renderEmptyState(msg.message);
      } else if (msg.type === 'EXPORT_SUCCESS' && msg.payload && typeof msg.payload === 'object') {
        currentPayload = msg.payload;
        renderExportSuccess(msg.payload);
      }
    };
  </script>
</body>
</html>
